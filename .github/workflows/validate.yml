name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hermes
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          cd /tmp/hermes-agent && pip install -e . --quiet 2>&1 | tail -5
      - name: Validate plugin
        run: hermes plugins validate ./plugin --install-deps
      - name: Run tests
        run: python -m pytest tests/ -q