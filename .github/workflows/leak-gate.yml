name: leak-gate

# The pre-commit hook is client-side and bypassable, so CI is the real enforcement.
on:
  push:
  pull_request:

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # history is scanned too

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan the tree
        run: ./scripts/leak-scan.sh .

      - name: Validate the skills tree
        run: python3 scripts/validate-skills.py .

      # Scoped to HEAD — the ref being built — and deliberately not `--all`. `--all` reaches every
      # branch the runner knows about, so one branch's content can fail another branch's build, and
      # the same commit can pass or fail depending only on what else existed at the time. A merge
      # gate has to answer "is what I am merging clean", and a gate that changes its answer when
      # somebody else pushes to an unrelated branch is not a gate. The repo-wide audit over `--all`
      # still exists (see CONTRIBUTING.md) and belongs before a release or a public flip, where
      # scanning every branch is the point rather than a side effect.
      - name: Scan the git history of this ref (identity / path / health)
        run: |
          git log -p HEAD -- . ':(exclude)scripts/leak-patterns.tsv' ':(exclude)scripts/leak-scan.sh' \
            | ./scripts/leak-scan.sh --no-gitleaks -

      # Separate from the tree scan on purpose: `gitleaks detect` walks git history unless
      # --no-git is passed, so the tree step above covers only what is on disk. History needs
      # its own secrets pass, and a personal name in a commit message is public forever.
      - name: Scan the full git history (secrets)
        run: gitleaks detect --source . --log-opts="--all" --no-banner --redact
